<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <img src="assets/mutebutton1.png" class="mute-btn" id="mute-btn" />
    <div class="lightbox" id="lightbox">
      <img id="lightbox-img" src="" />
    </div>
    <div class="top"></div>
    <div class="leftbg">
      <img src="assets/theoprins.jpg" class="sketchbg">
    </div>
    <div class="material">
      <img class="banner" />
      <img src="assets/back.png" class="next-page-btn" id="next-page-btn" />
      <img src="assets/wip.png" class="wip-sticker" />
      <img src="assets/bottomframe.png" class="frame" />
      <div class="content">
        <p>wunderkammer!</p>
      </div>
    </div>
    <img src="assets/topframe.png" class="topframe" />
    <img src="assets/leftbg.png" class="leftbgblur" />

    <div class="card-panel" id="card-folders-panel">
      <img src="assets/tuck-placeholder.png" class="tuck-btn" id="tuck-folders-btn" />
      <div class="card card-folders">
        <img src="assets/backbuttonsite.png" class="cardicon2"/>
        <div class="card-links card-folder-links"></div>
      </div>
    </div>

    <div class="card-panel" id="card-files-panel">
      <img src="assets/tuck-placeholder.png" class="tuck-btn" id="tuck-files-btn" />
      <div class="card card-files">
        <div class="card-links card-file-links"></div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
